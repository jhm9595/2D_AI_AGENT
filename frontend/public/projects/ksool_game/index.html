<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>주모! 한 잔 더! - 한국의 술 100선 크래프팅 도감</title>
  <style>
    :root {
      --primary: #3182f6;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    /* 모바일 웹뷰 컨테이너 */
    #app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 880px;
      background: #111827;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
    }
    @media (min-width: 480px) {
      #app-container {
        height: 90vh;
        border-radius: 24px;
      }
    }
    /* 헤더 */
    header {
      padding: 16px 20px;
      background: #1f2937;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }
    .progress-pill {
      font-size: 0.75rem;
      background: rgba(49, 130, 246, 0.2);
      color: #93c5fd;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      border: 1px solid rgba(49, 130, 246, 0.5);
      flex-shrink: 0;
    }

    /* 탭 메뉴 */
    .tab-bar {
      display: flex;
      background: #0f172a;
      border-bottom: 3px solid #3b82f6;
      flex-shrink: 0;
      width: 100%;
      z-index: 15;
    }
    .tab-btn {
      flex: 1;
      min-height: 52px;
      padding: 12px 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      color: #e2e8f0;
      background: #1e293b;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      letter-spacing: -0.3px;
    }
    .tab-btn:hover {
      background: #273549;
    }
    .tab-btn.active {
      color: #ffffff;
      background: #2563eb;
      font-weight: 900;
      box-shadow: inset 0 -3px 0 #93c5fd;
    }

    /* 본문 화면 */
    .view {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }
    .view.active {
      display: flex;
    }

    /* 양조장 (크래프팅) 화면 */
    .pot-section {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #1f2937 0%, #111827 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cauldron {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #1e293b;
      border: 4px dashed #475569;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s;
    }
    .cauldron.has-items {
      border-color: var(--primary);
      box-shadow: 0 0 25px rgba(49, 130, 246, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .pot-slots {
      display: flex;
      gap: 6px;
    }
    .slot-icon {
      font-size: 1.8rem;
    }
    .selected-chips {
      display: flex;
      gap: 6px;
      min-height: 32px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: #334155;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .chip button {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-weight: 900;
      font-size: 0.95rem;
      line-height: 1;
    }
    .mix-btn {
      width: 100%;
      max-width: 290px;
      padding: 13px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(49, 130, 246, 0.4);
      transition: all 0.2s;
    }
    .mix-btn:disabled {
      background: #374151;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .mix-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* 재료 인벤토리 */
    .inventory-section {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .ing-card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ing-card:active {
      transform: scale(0.92);
      border-color: var(--primary);
    }
    .ing-card.selected {
      background: rgba(49, 130, 246, 0.2);
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
    .ing-emoji {
      font-size: 1.6rem;
    }
    .ing-name {
      font-size: 0.74rem;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
      word-break: keep-all;
    }

    /* 도감 화면 및 필터 */
    .filter-scroll {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #111827;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #93c5fd;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
    }
    .sool-grid {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }
    .sool-card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sool-card.locked {
      opacity: 0.45;
      filter: grayscale(1);
    }
    .sool-emoji {
      font-size: 2.2rem;
    }
    .sool-name {
      font-size: 0.85rem;
      font-weight: 800;
      color: #f8fafc;
      text-align: center;
    }
    .sool-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      background: #334155;
      color: #93c5fd;
    }

    /* 결과 팝업 모달 */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-overlay.active {
      display: flex;
    }
    .result-card {
      background: #1e293b;
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-emoji {
      font-size: 3.8rem;
      margin: 4px 0;
    }
    .result-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f8fafc;
    }
    .result-desc {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .result-recipe {
      font-size: 0.75rem;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px;
      color: #38bdf8;
      border: 1px solid #334155;
      font-weight: 700;
    }
    .close-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 0.98rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 상단바 -->
  <header>
    <div class="brand">
      <span style="font-size: 1.5rem;">🍶</span>
      <div>
        <h1>주모! 한 잔 더!</h1>
        <div style="font-size: 0.7rem; color: #94a3b8; font-weight: 600;">한국의 술 100선 크래프팅</div>
      </div>
    </div>
    <div class="progress-pill">
      해금 도감: <span id="unlocked-count">1</span> / 100
    </div>
  </header>

  <!-- 메인 탭 네비게이션 -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('brew')">⚗️ 주조실 (합성)</button>
    <button class="tab-btn" onclick="switchTab('collection')">📜 주막 도감 (100선)</button>
  </nav>

  <!-- 화면 1: 주조실 (Crafting) -->
  <div id="view-brew" class="view active">
    <div class="pot-section">
      <div id="cauldron" class="cauldron">
        <div id="pot-slots" class="pot-slots">
          <span style="font-size: 2.2rem; opacity: 0.4;">🍶</span>
        </div>
      </div>
      <div id="selected-chips" class="selected-chips">
        <span style="font-size: 0.8rem; color: #94a3b8; line-height: 32px; font-weight: 600;">하단에서 재료를 2~3개 선택하세요</span>
      </div>
      <button id="mix-btn" class="mix-btn" disabled onclick="craftSool()">술 빚기 (조합 실행)</button>
    </div>

    <div class="inventory-section">
      <div class="section-title">
        <span>선택 가능한 천연 재료 (24종)</span>
        <button onclick="clearSelection()" style="background: none; border: none; color: #60a5fa; font-size: 0.8rem; font-weight: 700; cursor: pointer;">선택 비우기</button>
      </div>
      <div id="ingredients-grid" class="ingredients-grid">
        <!-- JS 렌더링 -->
      </div>
    </div>
  </div>

  <!-- 화면 2: 도감 (Collection) -->
  <div id="view-collection" class="view">
    <div class="filter-scroll">
      <button class="filter-btn active" onclick="filterCategory('전체')">전체보기 (100)</button>
      <button class="filter-btn" onclick="filterCategory('폭탄주')">💥 폭탄주/이색</button>
      <button class="filter-btn" onclick="filterCategory('국민주')">🍺 국민 데일리</button>
      <button class="filter-btn" onclick="filterCategory('전통명주')">🏺 전통명주/약주</button>
      <button class="filter-btn" onclick="filterCategory('증류주')">🥃 K-프리미엄 증류</button>
      <button class="filter-btn" onclick="filterCategory('탁주/약주')">🥛 탁주/막걸리</button>
      <button class="filter-btn" onclick="filterCategory('과실주')">🍇 지역특산 과실주</button>
    </div>
    <div id="sool-grid" class="sool-grid">
      <!-- JS 렌더링 -->
    </div>
  </div>

  <!-- 결과 팝업 모달 -->
  <div id="modal" class="modal-overlay">
    <div class="result-card">
      <div id="res-tag" class="sool-tag">폭탄주/이색믹스</div>
      <div id="res-emoji" class="result-emoji">🍺</div>
      <div id="res-title" class="result-title">소맥</div>
      <div id="res-desc" class="result-desc">설명</div>
      <div id="res-recipe" class="result-recipe">조합법</div>
      <button class="close-btn" onclick="closeModal()">도감에 저장하기</button>
    </div>
  </div>
</div>

let selectedIngredients = [];
let unlockedIds = ['somaek'];
try {
  const saved = localStorage.getItem('ksool_unlocked');
  if (saved) {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed) && parsed.length > 0) {
      unlockedIds = parsed.filter(id => typeof id === 'string' && RECIPES.some(r => r.id === id));
      if (!unlockedIds.includes('somaek')) unlockedIds.unshift('somaek');
    }
  }
} catch (e) {
  unlockedIds = ['somaek'];
}
let currentCategory = '전체';

// 사운드 합성 (Web Audio API)
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'tap') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    } else if (type === 'success') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
      if (navigator.vibrate) navigator.vibrate([40, 60, 100]);
    } else if (type === 'fail') {
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.setValueAtTime(180, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch (e) {}
}

// 렌더링: 재료 목록
function renderIngredients() {
  const grid = document.getElementById('ingredients-grid');
  grid.innerHTML = INGREDIENTS.map(ing => {
    const isSelected = selectedIngredients.includes(ing.id);
    return `
      <div class="ing-card ${isSelected ? 'selected' : ''}" onclick="toggleIngredient('${ing.id}')">
        <span class="ing-emoji">${ing.emoji}</span>
        <span class="ing-name">${ing.name}</span>
      </div>
    `;
  }).join('');
}

// 재료 토글
function toggleIngredient(id) {
  playSound('tap');
  const index = selectedIngredients.indexOf(id);
  if (index > -1) {
    selectedIngredients.splice(index, 1);
  } else {
    if (selectedIngredients.length >= 3) {
      alert('재료는 최대 3개까지만 조합할 수 있습니다.');
      return;
    }
    selectedIngredients.push(id);
  }
  updateSelectionUI();
  renderIngredients();
}

function clearSelection() {
  selectedIngredients = [];
  updateSelectionUI();
  renderIngredients();
}

function updateSelectionUI() {
  const chipsContainer = document.getElementById('selected-chips');
  const mixBtn = document.getElementById('mix-btn');
  const cauldron = document.getElementById('cauldron');
  const potSlots = document.getElementById('pot-slots');

  if (selectedIngredients.length === 0) {
    chipsContainer.innerHTML = '<span style="font-size: 0.8rem; color: #94a3b8; line-height: 32px; font-weight: 600;">하단에서 재료를 2~3개 선택하세요</span>';
    mixBtn.disabled = true;
    cauldron.classList.remove('has-items');
    potSlots.innerHTML = '<span style="font-size: 2.2rem; opacity: 0.4;">🍶</span>';
  } else {
    chipsContainer.innerHTML = selectedIngredients.map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return `<div class="chip"><span>${ing.emoji}</span> ${ing.name} <button onclick="toggleIngredient('${id}')">×</button></div>`;
    }).join('');

    potSlots.innerHTML = selectedIngredients.map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return `<span class="slot-icon">${ing.emoji}</span>`;
    }).join('');

    cauldron.classList.add('has-items');
    mixBtn.disabled = selectedIngredients.length < 2;
  }
}

// 조합(술 빚기) 실행
function craftSool() {
  const currentSet = [...selectedIngredients].sort();
  
  // 일치 레시피 탐색 (100% Unique Sorted Key 매칭)
  const matched = RECIPES.find(r => {
    const rSet = [...r.items].sort();
    return rSet.length === currentSet.length && rSet.every((val, idx) => val === currentSet[idx]);
  });

  if (matched) {
    playSound('success');
    if (!unlockedIds.includes(matched.id)) {
      unlockedIds.push(matched.id);
      localStorage.setItem('ksool_unlocked', JSON.stringify(unlockedIds));
      updateProgress();
    }
    showResultModal(matched, true);
  } else {
    playSound('fail');
    showResultModal({
      name: '괴식 폭탄주 (조합 실패)',
      category: '조합 실패',
      emoji: '🧪',
      desc: '으악! 이 맛은 도저히 사람이 마실 수 없는 이상한 혼합물입니다... 다른 재료의 조화를 연구해보세요!',
      recipeStr: selectedIngredients.map(id => {
        const found = INGREDIENTS.find(i => i.id === id);
        return found ? found.name : id;
      }).join(' + ')
    }, false);
  }

  clearSelection();
}

// 결과 모달 표시 (XSS 방지를 위해 textContent 안전 대입)
function showResultModal(item, isSuccess) {
  const modal = document.getElementById('modal');
  document.getElementById('res-tag').textContent = item.category;
  document.getElementById('res-emoji').textContent = item.emoji;
  document.getElementById('res-title').textContent = item.name;
  document.getElementById('res-desc').textContent = item.desc;
  
  const recipeText = item.items 
    ? '성공 레시피: ' + item.items.map(id => {
        const found = INGREDIENTS.find(i => i.id === id);
        return found ? found.name : id;
      }).join(' + ')
    : '시도한 재료: ' + item.recipeStr;
  document.getElementById('res-recipe').textContent = recipeText;

  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  renderCollection();
}

// 도감 렌더링
function renderCollection() {
  const grid = document.getElementById('sool-grid');
  const filtered = currentCategory === '전체' 
    ? RECIPES 
    : RECIPES.filter(r => r.category.includes(currentCategory));

  grid.innerHTML = filtered.map(item => {
    const isUnlocked = unlockedIds.includes(item.id);
    return `
      <div class="sool-card ${isUnlocked ? '' : 'locked'}" onclick="${isUnlocked ? `showResultModal(RECIPES.find(r=>r.id==='${item.id}'), true)` : `alert('아직 발견하지 못한 비전의 명주입니다! 주조실에서 새로운 재료를 조합해보세요.')`}">
        <span class="sool-emoji">${isUnlocked ? item.emoji : '❓'}</span>
        <span class="sool-name">${isUnlocked ? item.name : '미지의 술'}</span>
        <span class="sool-tag">${item.category}</span>
      </div>
    `;
  }).join('');
}

function filterCategory(cat) {
  playSound('tap');
  currentCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(cat));
  });
  renderCollection();
}

function switchTab(tab) {
  playSound('tap');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

  if (tab === 'brew') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('view-brew').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('view-collection').classList.add('active');
    renderCollection();
  }
}

function updateProgress() {
  document.getElementById('unlocked-count').textContent = unlockedIds.length;
}

// 데이터 정합성 자체 검증 루틴 (DB 무결성 보장: 100종 일치 및 충돌 0건 보장)
(function validateDatabaseIntegrity() {
  const ingIds = new Set(INGREDIENTS.map(i => i.id));
  const recipeSets = new Map();
  let errorsFound = 0;
  
  if (RECIPES.length !== 100) {
    console.error(`[DBA ALERT] RECIPES count is ${RECIPES.length}, expected exactly 100!`);
    errorsFound++;
  }
  
  RECIPES.forEach((r, idx) => {
    // 1. 모든 재료가 INGREDIENTS에 실재하는지 검증
    r.items.forEach(itemId => {
      if (!ingIds.has(itemId)) {
        console.error(`[DBA ALERT] Invalid ingredient '${itemId}' in recipe '${r.id}'`);
        errorsFound++;
      }
    });
    // 2. 조합 레시피 중복(Collision) 여부 검증
    const sortedKey = [...r.items].sort().join('+');
    if (recipeSets.has(sortedKey)) {
      console.error(`[DBA ALERT] Duplicate recipe combination key detected: ${sortedKey} (collision between '${recipeSets.get(sortedKey)}' and '${r.id}')`);
      errorsFound++;
    } else {
      recipeSets.set(sortedKey, r.id);
    }
  });

  if (errorsFound === 0) {
    console.log(`%c[DBA 무결성 검증 통과] 100종의 레시피 조합식 키가 100% 고유(Unique)하며 정합성이 확보되었습니다.`, "color: #38bdf8; font-weight: bold;");
  }
})();

// 초기 구동
renderIngredients();
renderCollection();
updateProgress();
</script>
</body>
